<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GGn Lime STMPE Theme</title>
    <link rel="stylesheet" href="./style.css">
    <style>
      body { min-width: 0; }
      .demo {
        max-width: 920px;
        margin: 0 auto;
        padding: 56px 24px;
      }
      .demo h1 {
        margin: 0 0 10px;
        font-size: 34px;
      }
      .demo p {
        margin: 0 0 18px;
        color: var(--text-2);
      }
      .demo code {
        display: inline-block;
        padding: 3px 7px;
      }
      .demo .box {
        margin-top: 24px !important;
      }
      .demo .pad {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <h1>GGn Lime STMPE Theme</h1>
      <p>A standalone lime/neon-green Gazelle stylesheet adapted from the PTP-STMPE v2 look for GGn.</p>
      <div class="box">
        <div class="head colhead_dark"><strong>Stylesheet URL</strong></div>
        <div class="pad">
          <p>Use this URL in your GGn profile stylesheet field:</p>
          <p><code>https://high-guy-uk.github.io/ggn-lime-stmpe/style.css</code></p>
        </div>
      </div>
    </main>
  </body>
</html>
